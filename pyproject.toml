[project]
name = "nonebot-plugin-dialectlist"
version = "3.3.0"
description = "看看你群群友有多能说"
authors = [{ name = "Chen_Xu233", email = "woyerpa@outlook.com" }]
dependencies = [
    "nonebot2>=2.4.0",
    "nonebot-plugin-chatrecorder>=0.7.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.0",
    "nonebot-plugin-orm[sqlite]>=0.8.0",
    "nonebot-plugin-alconna>=0.50.2",
    "nonebot-plugin-uninfo>=0.8.0",
    "nonebot-plugin-userinfo>=0.2.6",
    # 0.6 开箱即用；0.8 需要 RENDER__PROVIDER=playwright（见 README）。
    # 模板资源已全部内联，所以 0.8 的本地文件访问限制不影响出图。
    "nonebot-plugin-htmlrender>=0.6.6,<0.9",
    # htmlrender 0.8 起不再自带浏览器后端，这里显式保证有可用的后端
    "playwright>=1.48.0",
    "nonebot-plugin-send-anything-anywhere>=0.7.1",
    "httpx>=0.27.0",
    "jinja2>=3.0.3",
    "sqlalchemy>=2.0.0",
    "pillow>=11.3.0",
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = { text = "MIT" }


[project.optional-dependencies]
dev = [
    "ruff>=0.5.5",
    "twine>=6.2.0",
    "nb-cli>=1.4.2",
    "py-spy>=0.3.14",
]
Test = ["nonebot-adapter-onebot>=2.4.4"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.ruff.lint]
ignore = ["E402"]

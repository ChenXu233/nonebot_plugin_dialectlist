[project]
name = "nonebot-plugin-dialectlist"
version = "3.0.2"
description = "看看你群群友有多能说"
authors = [{ name = "Chen_Xu233", email = "woyerpa@outlook.com" }]
dependencies = [
    "nonebot2>=2.4.0",
    "nonebot-plugin-chatrecorder>=0.7.0",
    "nonebot-plugin-orm[sqlite]>=0.8.0",
    "nonebot-plugin-alconna>=0.50.2",
    "nonebot-plugin-uninfo>=0.8.0",
    "nonebot-plugin-userinfo>=0.2.6",
    # 0.7 起渲染后端改为显式配置（RENDER_BACKEND / RENDER__PROVIDER），
    # 0.8 还要求 nonebot2>=2.5 且默认禁止读取本地资源，出图会变空白。
    # 这里锁在最后一个开箱即用的 0.6.x；详见 README「关于 htmlrender 版本」。
    "nonebot-plugin-htmlrender>=0.6.6,<0.7",
    "nonebot-plugin-localstore>=0.7.0",
    "nonebot-plugin-send-anything-anywhere>=0.7.1",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pillow>=11.3.0",
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = { text = "MIT" }


[project.optional-dependencies]
dev = [
    "ruff>=0.5.5",
    "twine>=6.2.0",
    "nb-cli>=1.4.2",
    "py-spy>=0.3.14",
]
Test = ["nonebot-adapter-onebot>=2.4.4"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = 'single'
indent-style = 'tab'

[tool.ruff.lint]
ignore = ["E402"]

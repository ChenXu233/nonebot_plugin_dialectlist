# 打 V* tag 时：先校验 CHANGELOG，再发 PyPI，最后创建 GitHub Release
name: Upload Python Package

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 V3.4.0）'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 校验 CHANGELOG
      run: |
        set -euo pipefail
        version="${RELEASE_TAG#[Vv]}"
        file="CHANGELOG/v${version}.md"
        if [ ! -s "$file" ]; then
          echo "::error::缺少 $file，请先写好该版本的 CHANGELOG 再打 tag"
          exit 1
        fi
        echo "CHANGELOG_FILE=$file" >> "$GITHUB_ENV"
        echo "已找到 $file"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 校验 CHANGELOG
      run: |
        set -euo pipefail
        version="${RELEASE_TAG#[Vv]}"
        file="CHANGELOG/v${version}.md"
        if [ ! -s "$file" ]; then
          echo "::error::缺少 $file，无法创建 Release"
          exit 1
        fi
        echo "CHANGELOG_FILE=$file" >> "$GITHUB_ENV"

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: 🔖 Release-${{ env.RELEASE_TAG }}
        body_path: ${{ env.CHANGELOG_FILE }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
